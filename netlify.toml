# Front estático + función de Claudia (netlify/functions/chat.mjs → /api/chat).
# El build no compila el front: empaqueta el conocimiento de Claudia y copia a
# dist/ sólo los archivos públicos. Los encabezados de seguridad están en _headers.

[build]
  publish = "dist"
  # 1) data/, i18n/ y claudia-conocimiento.md → módulo de la función
  # 2) dist/ sin claudia-conocimiento.md ni netlify/
  command = "node netlify/build-knowledge.mjs && node netlify/build-site.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
